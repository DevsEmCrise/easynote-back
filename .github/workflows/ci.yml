name: CI - Testes de Integração

on:
  pull_request:

jobs:
  integration-tests:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.DB1_PASS }}
          MYSQL_DATABASE: ${{ secrets.DB1_NAME }}
          MYSQL_USER: ${{ secrets.DB1_USER }}
          MYSQL_PASSWORD: ${{ secrets.DB1_PASS_1 }}
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DB1_HOST: 127.0.0.1
      DB1_PORT: 3306
      DB1_NAME: ${{ secrets.DB1_NAME }}
      DB1_USER: ${{ secrets.DB1_USER }}
      DB1_PASS: ${{ secrets.DB1_PASS_1 }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Run tests
        run: mvn clean test
